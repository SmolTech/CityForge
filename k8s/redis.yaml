apiVersion: apps/v1
kind: Deployment
metadata:
  name: cityforge-redis
  namespace: cityforge
  labels:
    app: cityforge
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cityforge
      component: redis
  template:
    metadata:
      labels:
        app: cityforge
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cityforge-redis
  namespace: cityforge
  labels:
    app: cityforge
    component: redis
spec:
  selector:
    app: cityforge
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
