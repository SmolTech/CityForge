apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-admin-digest
  labels:
    app: cityforge
    component: admin-digest
spec:
  # Run daily at 8:00 AM (adjust timezone as needed)
  schedule: "0 8 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cityforge
            component: admin-digest
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: admin-digest
              image: ghcr.io/smoltech/cityforge
              imagePullPolicy: Always
              command: ["python"]
              args: ["manage.py", "send_admin_digest"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              env:
                - name: NODE_ENV
                  value: "production"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: cityforge.cityforge-db.credentials.postgresql.acid.zalan.do
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cityforge.cityforge-db.credentials.postgresql.acid.zalan.do
                      key: password
                - name: POSTGRES_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_PORT
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_DB
                - name: DATABASE_URL
                  value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cityforge-secrets
                      key: DJANGO_SECRET_KEY
                - name: NEXT_PUBLIC_SITE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: NEXT_PUBLIC_SITE_URL
                - name: REDIS_DEFAULT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: REDIS_DEFAULT_URL
                - name: REDIS_CARDS_URL
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: REDIS_CARDS_URL
                - name: REDIS_SEARCH_URL
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: REDIS_SEARCH_URL
                - name: WEBHOOKS_ENABLED
                  value: "true"
                - name: MAILGUN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mailgun-email
                      key: MAILGUN_API_KEY
                      optional: true
                - name: MAILGUN_DOMAIN
                  valueFrom:
                    secretKeyRef:
                      name: mailgun-email
                      key: MAILGUN_DOMAIN
                      optional: true
                - name: MAILGUN_REGION
                  valueFrom:
                    secretKeyRef:
                      name: mailgun-email
                      key: MAILGUN_REGION
                      optional: true
                - name: EMAIL_FROM
                  valueFrom:
                    secretKeyRef:
                      name: mailgun-email
                      key: EMAIL_FROM
                      optional: true
                - name: EMAIL_FROM_NAME
                  valueFrom:
                    secretKeyRef:
                      name: mailgun-email
                      key: EMAIL_FROM_NAME
                      optional: true
              resources:
                requests:
                  memory: 256Mi
                limits:
                  memory: 512Mi
