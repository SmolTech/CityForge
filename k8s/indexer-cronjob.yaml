apiVersion: batch/v1
kind: CronJob
metadata:
  name: resource-indexer
  namespace: cityforge
  labels:
    app: resource-indexer
spec:
  schedule: "0 2 * * *" # Run daily at 2 AM
  timeZone: "America/New_York"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: indexer
              image: ghcr.io/smoltech/cityforge
              imagePullPolicy: Always
              # The runtime image only contains the venv; poetry is not installed.
              command: ["python", "indexer/indexer.py"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                capabilities:
                  drop:
                    - ALL
              env:
                - name: OPENSEARCH_HOST
                  value: "opensearch-service"
                - name: OPENSEARCH_PORT
                  value: "9200"
                - name: NAMESPACE
                  value: "cityforge"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: cityforge.cityforge-db.credentials.postgresql.acid.zalan.do
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: cityforge.cityforge-db.credentials.postgresql.acid.zalan.do
                - name: POSTGRES_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_HOST
                - name: POSTGRES_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_PORT
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: cityforge-config
                      key: POSTGRES_DB
                - name: DATABASE_URL
                  value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
                - name: BACKEND_URL
                  value: "http://cityforge-service/api"
              resources:
                requests:
                  memory: "128Mi"
                limits:
                  memory: "512Mi"
          restartPolicy: OnFailure
