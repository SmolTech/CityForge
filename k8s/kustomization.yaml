apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass-retain.yaml
  - config.yaml
  - nginx-config.yaml
  - deployment.yaml
  - service.yaml
  - redis.yaml
  - postgres.yaml
  - uploads-pvc.yaml
  - ingress.yaml
  - opensearch.yaml
  - backup-cronjob.yaml
  - indexer-cronjob.yaml
  - admin-digest-cronjob.yaml

# Secrets are NOT included in this base because they contain sensitive values.
# Create them before deploying, using the *.example / *.template files as guides:
#   kubectl create secret generic cityforge-secrets \
#     --from-literal=DJANGO_SECRET_KEY="..." -n cityforge
#   kubectl create secret generic mailgun-email \
#     --from-literal=MAILGUN_API_KEY="..." ... -n cityforge
#   kubectl create secret generic cityforge-s3-credentials \
#     --from-literal=s3_access_key_id="..." ... -n cityforge

images:
  - name: ghcr.io/smoltech/cityforge
    newTag: latest

namespace: cityforge
