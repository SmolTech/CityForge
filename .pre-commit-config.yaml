repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-unit
        name: unit tests
        entry: poetry run pytest apps --ignore=tests/e2e
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-e2e
        name: e2e tests
        entry: poetry run pytest tests/e2e -m e2e --no-cov
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: semgrep-local
        name: semgrep (python & django)
        entry: .venv/bin/semgrep
        language: system
        pass_filenames: false
        args:
          - --config=p/python
          - --config=p/django
          - --config=p/security-audit
          - --config=p/dockerfile
          - --error
          - --skip-unknown-extensions
          - --exclude=reference
          - --exclude=.venv
          - --exclude=node_modules
          - --exclude=staticfiles

      - id: mobile-lint
        name: mobile eslint
        entry: bash -c 'cd mobile && npm run lint'
        language: system
        files: ^mobile/src/
        stages: [pre-commit]

      - id: mobile-type-check
        name: mobile type check
        entry: bash -c 'cd mobile && npm run type-check'
        language: system
        files: ^mobile/
        stages: [pre-commit]

      - id: mobile-expo-doctor
        name: expo health check
        entry: bash -c 'cd mobile && npx expo-doctor'
        language: system
        files: ^mobile/
        stages: [pre-commit]
        pass_filenames: false

