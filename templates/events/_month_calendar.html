<div class="event-calendar">
  <div class="event-page-header">
    <div>
      <h2>{{ current_month|date:"F Y" }}</h2>
      <p class="muted">Browse community events by month.</p>
    </div>
  </div>

  <div class="calendar-nav">
    <a href="?month={{ prev_month }}">← Previous</a>
    <a href="?month={{ next_month }}">Next →</a>
  </div>

  <div class="calendar-grid calendar-head">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>

  <div class="calendar-body">
    {% for week in weeks %}
      <div class="calendar-grid">
        {% for day in week %}
          <div class="calendar-day{% if not day.in_month %} muted-day{% endif %}{% if day.is_today %} today{% endif %}">
            <div class="calendar-day-number">{{ day.date.day }}</div>
            {% for event in day.events %}
              <a class="calendar-event" href="{% url 'events:event_detail' pk=event.pk slug=event.slug %}">{{ event.title }}</a>
            {% endfor %}
          </div>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</div>
