{% extends "base.html" %}
{% block content %}
<div class="cms-shell">
  <aside class="cms-nav">
    <strong>Manage</strong>
    <ul>
      <li><a href="{% url 'cms:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Overview</a></li>
      <li><a href="{% url 'cms:submissions_list' %}" class="{% if 'submission' in request.resolver_match.url_name %}active{% endif %}">Submissions</a></li>
      <li><a href="{% url 'cms:cards_list' %}" class="{% if 'card' in request.resolver_match.url_name %}active{% endif %}">Businesses</a></li>
      <li><a href="{% url 'cms:tags_list' %}" class="{% if 'tag' in request.resolver_match.url_name %}active{% endif %}">Tags</a></li>
      <li><a href="{% url 'cms:reviews_list' %}" class="{% if 'review' in request.resolver_match.url_name %}active{% endif %}">Reviews</a></li>
      {% if user.is_admin or user.is_superuser %}
        <li><a href="{% url 'cms:users_list' %}" class="{% if 'user' in request.resolver_match.url_name %}active{% endif %}">Users</a></li>
      {% endif %}
    </ul>
  </aside>
  <section class="cms-main">
    {% block cms_content %}{% endblock %}
  </section>
</div>
{% endblock %}
