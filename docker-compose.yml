services:
  postgres:
    image: postgres:17-alpine
    container_name: cityforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: cityforge-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityforge-web
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      SECURE_SSL_REDIRECT: "False"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_db
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_NAMESPACE: default
      SITE_NAME: CityForge
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: ChangeThisPassword123!
    volumes:
      - web_uploads:/app/uploads
      - web_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    container_name: cityforge-indexer
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      BACKEND_URL: http://web:8000
      NAMESPACE: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: community_db
    depends_on:
      web:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  opensearch_data:
  web_uploads:
  web_static:
