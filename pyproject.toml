[tool.poetry]
name = "cityforge"
version = "2.0.11"
description = "Community platform: business directory, forums, classifieds, and resources built on Django."
authors = ["CityForge contributors"]
license = "See LICENSE"
readme = "README.md"
packages = [
    { include = "cityforge" },
    { include = "apps" },
]

[tool.poetry.dependencies]
python = "^3.12"
Django = ">6,<7"
psycopg = {version = ">=3.1", extras = ["binary"]}
dj-database-url = ">=2.1"
django-environ = ">=0.11"
opensearch-py = ">=2.4"
requests = ">=2.32"
beautifulsoup4 = ">=4.12"
Pillow = ">=10.0"
gunicorn = ">=21.2"
whitenoise = ">=6.6"
bcrypt = "^5.0.0"
drf-spectacular = "^0.29.0"
redis = "^7.4.0"
django-redis = "^6.0.0"
PyJWT = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
ruff = ">=0.5"
semgrep = ">=1.70"
pre-commit = ">=3.7"
pytest-cov = "^7.1.0"
mypy = "^2.1.0"
django-stubs = {extras = ["compatible-mypy"], version = "^6.0.5"}

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
# Legacy Prisma imports preserve nullable string columns from the source schema.
ignore = ["E501", "DJ001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
exclude = [
    "migrations",
    ".venv",
    "reference",
]

# Production source code must be fully annotated.
[[tool.mypy.overrides]]
module = [
    "apps.accounts.*",
    "apps.classifieds.*",
    "apps.cms.*",
    "apps.core.*",
    "apps.directory.*",
    "apps.events.*",
    "apps.forums.*",
    "apps.indexing.*",
    "apps.resources.*",
    "apps.search.*",
    "apps.webhooks.*",
    "cityforge.*",
    "indexer.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Tests are checked, but we do not require every test helper to be fully annotated.
[[tool.mypy.overrides]]
module = [
    "apps.*.tests",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "cityforge.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cityforge.settings"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "--cov=apps --cov=cityforge --cov-report=term-missing --cov-fail-under=90 -ra"
markers = [
    "e2e: critical end-to-end user journeys",
]
