[tool.poetry]
name = "cityforge"
version = "2.0.0"
description = "Community platform: business directory, forums, classifieds, and resources built on Django."
authors = ["CityForge contributors"]
license = "See LICENSE"
readme = "README.md"
packages = [
    { include = "cityforge" },
    { include = "apps" },
]

[tool.poetry.dependencies]
python = "^3.12"
Django = ">=5.0,<5.2"
psycopg = {version = ">=3.1", extras = ["binary"]}
dj-database-url = ">=2.1"
django-environ = ">=0.11"
opensearch-py = ">=2.4"
Pillow = ">=10.0"
gunicorn = ">=21.2"
whitenoise = ">=6.6"
bcrypt = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
ruff = ">=0.5"
semgrep = ">=1.70"
pre-commit = ">=3.7"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
# Legacy Prisma imports preserve nullable string columns from the source schema.
ignore = ["E501", "DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cityforge.settings"
python_files = ["test_*.py", "tests.py", "*_tests.py"]
addopts = "--cov=apps --cov=cityforge --cov-report=term-missing --cov-fail-under=90 -ra"
markers = [
    "e2e: critical end-to-end user journeys",
]
